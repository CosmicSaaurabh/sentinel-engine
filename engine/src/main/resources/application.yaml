spring:
  application:
    name: sentinel-engine
  datasource:
    url: jdbc:postgresql://localhost:55432/sentinel
    username: sentinel
    password: sentinel
    hikari:
      # Sized against the claim path, which holds one connection for the length of one short
      # transaction. The rule that ties this number to the rest of the system: the request executor
      # must never be able to demand more connections than the pool can supply, or the pool becomes
      # an invisible second queue where latency accumulates with nothing pointing at the cause.
      maximum-pool-size: 20
      minimum-idle: 5
      # A claim that cannot get a connection must fail fast and let the worker back off, rather
      # than queue inside Hikari. A blocked claimer looks healthy while doing nothing.
      connection-timeout: 2000
      validation-timeout: 1000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  grpc:
    server:
      # The worker protocol gets its own port. It is a separate protocol with separate deadline
      # and keepalive semantics from the management HTTP endpoints, and mixing them would mean one
      # set of timeouts governing two very different traffic shapes.
      port: 9090
      keepalive:
        # Detects a peer that has gone away without saying so: a NAT entry expiring, a middlebox
        # forgetting the connection, a laptop lid closing. Without this the engine would hold long
        # polls for workers that no longer exist.
        time: 60s
        timeout: 20s
      inbound:
        message:
          max-size: 4194304B

sentinel:
  grpc:
    # Ceiling on how long the engine holds a poll open, whatever the client asks for. A client
    # cannot pin a waiter indefinitely.
    max-poll-wait: 20s
    # How often a parked poll re-attempts the claim. This single number is both the dispatch
    # latency a worker sees and the total query load an idle fleet generates, so it is the knob to
    # turn when trading one against the other.
    poll-retry-interval: 250ms
    # Virtual threads make a waiting poll cheap, not free. An unbounded number of cheap waiters is
    # still an unbounded queue, so the overflow is shed rather than parked.
    max-waiting-polls: 2000
    waiting-poll-retry-after: 1s
    # Far below gRPC's own 4 MB message cap, because the binding constraint is not the wire: every
    # payload lands in a jsonb column and is copied again into the outbox. Large data belongs in
    # storage the client owns, passed through the workflow as a reference.
    max-payload-bytes: 262144
  dag:
    # Submission writes a whole DAG inside one transaction, so the DAG has to be bounded or the
    # transaction is not. A rejected oversized submission is a clear error; an accepted one is a
    # latency spike nobody can attribute.
    max-tasks: 1000
    max-edges: 10000
  admission:
    enabled: true
    # Tasks in flight across the fleet before new workflows are refused outright. Refusing is the
    # only answer that gives the caller the information it needs to slow down; accepting turns a
    # visible rejection into an invisible backlog.
    total-slots: 10000
    # Jittered before it is sent, so a rejected fleet does not return in one synchronised wave.
    retry-after: 5s
  reaper:
    enabled: true
    # Detection latency is dominated by the lease duration, so this only has to be comfortably
    # below it. Running it faster buys almost nothing.
    interval: 5s
    # Every instance starts its reaper at roughly the same moment after a deployment, so without
    # jitter they would reap in lockstep forever after and mostly find each other's leftovers.
    jitter: 0.4
    # Bounds the transaction size and lock footprint, which is what stops a mass expiry from
    # becoming one enormous transaction that blocks every claimer.
    batch-size: 200
    # Jittered per task inside the SQL. A single delay for a whole batch would remove the lock
    # contention and then recreate the stampede one step later.
    requeue-delay: 5s
  retry:
    # Exponential with full jitter: 2s, 4s, 8s ... capped. Jitter is not decoration. Failures are
    # correlated, so a deterministic schedule makes a thousand tasks retry on the same instant and
    # knock the recovering downstream service back down.
    base-delay: 2s
    max-delay: 5m
    # Resolved at submission and stored on the task row, so changing it here cannot retroactively
    # exhaust a task that is already in flight.
    max-attempts: 10
    # Per-task-type overrides. Anything absent uses the values above. Every field is optional, so
    # naming a type to change its budget does not silently reset its delays.
    #
    # policies:
    #   billing.charge:       # rate-limited payment API: back off hard, give up early
    #     base-delay: 10s
    #     max-delay: 15m
    #     max-attempts: 5
    #   report.render:        # cheap and idempotent: retry fast, try often
    #     base-delay: 500ms
    #     max-attempts: 20
  claim:
    # Lease is three heartbeat intervals, which is what NFR4's recovery bound is expressed in.
    # A worker may miss two heartbeats to a network blip without losing work it is still doing.
    lease-duration: 30s
    # A worker cannot usefully hold more leases than it has threads, so the engine caps the
    # request rather than trusting a worker to ask for a sensible number.
    max-batch-size: 32
    record-claim-events: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
