spring:
  application:
    name: sentinel-engine
  datasource:
    url: jdbc:postgresql://localhost:55432/sentinel
    username: sentinel
    password: sentinel
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 2000
      validation-timeout: 1000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
